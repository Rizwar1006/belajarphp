<script>
    let a = 10;
    let b = 5;
    let jumlah = a + b;
    let kurang = a - b;
    let kali = a * b;
    let bagi = a / b;
    let modulo = a % b;
    document.write("Hasil Penjumlahan = " + jumlah + "<br>");
    document.write("Hasil Pengurangan = " + kurang + "<br>");
    document.write("Hasil Perkalian = " + kali + "<br>");
    document.write("Hasil Pembagian = " + bagi + "<br>");
    document.write("Hasil Modulo = " + modulo + "<br>");
</script>
