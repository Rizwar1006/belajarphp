<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title> Blockquote Example</title>
  </head>
<body>
  <h1>Hello World h1</h1>
  <p>Hallo manusia manusia, <br>semoga harimu cerah. 
  Sehat selalu lalu. </p>
  <blockquote>
    "Hari hari emas penuh dengan berlian."
  </blockquote>
</body>
</html>
